# Alternative to FerrumProxy: HTTPS frontend -> PROXY v2 backend on Tailscale.
frontend fileshare_https
    bind :443 ssl crt /etc/haproxy/certs/share.pexserver.com.pem alpn http/1.1
    mode tcp
    default_backend fileshare_a8
backend fileshare_a8
    mode tcp
    server a8 100.69.76.52:8100 send-proxy-v2
# Never reuse a backend PROXY connection for a different original client.
